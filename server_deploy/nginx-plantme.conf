server {
    if ($host = www.plantme.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = plantme.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name plantmne.in www.plantmne.in plantme.in www.plantme.in *.plantmne.in;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }




}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name plantmne.in www.plantmne.in plantme.in www.plantme.in *.plantmne.in;
    ssl_certificate /etc/letsencrypt/live/plantme.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/plantme.in/privkey.pem; # managed by Certbot


    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


}
